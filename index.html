<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuoteVerse — Live Animated Random Quote Experience</title>
  <meta name="description" content="A visually stunning, responsive random quote generator featuring live particle animations, interactive 3D tilt, dark/light themes, text-to-speech, and favorites.">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Live Dynamic Animated Backgrounds -->
  <div class="aurora-bg" aria-hidden="true"></div>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="logo-wrapper" id="brand-logo" title="QuoteVerse">
      <div class="logo-icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path>
          <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="app-title">QuoteVerse</h1>
        <span class="app-subtitle">Daily Inspiration</span>
      </div>
    </div>

    <!-- Header Tools (Sound FX, Favorites Drawer, Theme Toggle) -->
    <div class="header-controls">
      <!-- Ambient Sound FX Toggle -->
      <button id="sound-toggle-btn" class="nav-icon-btn" aria-label="Toggle Sound Effects" title="Toggle Sound Chime">
        <svg id="sound-on-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg id="sound-off-icon" style="display:none;" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
          <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <span class="sr-only">Toggle Sound Chime</span>
      </button>

      <!-- Favorites Drawer Trigger -->
      <button id="favorites-toggle-btn" class="nav-icon-btn" aria-label="View Saved Favorites" title="Saved Favorites">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span id="fav-count-badge" class="badge-count" style="display:none;">0</span>
        <span class="sr-only">View Favorites</span>
      </button>

      <!-- Theme Switcher Button -->
      <button id="theme-toggle-btn" class="nav-icon-btn" aria-label="Toggle theme mode" title="Switch Theme">
        <svg id="theme-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <span class="sr-only">Toggle Dark/Light Mode</span>
      </button>
    </div>
  </header>

  <!-- Live Category Filter Chips -->
  <div class="category-chips-wrapper" id="category-chips" role="tablist" aria-label="Quote categories">
    <!-- Populated dynamically via app.js -->
  </div>
  <select id="category-select" class="hidden-accessible-select" aria-label="Select Category">
    <option value="all">All</option>
  </select>

  <!-- Main Content Container with 3D Tilt Wrapper -->
  <main class="main-content">
    <div class="card-tilt-container" id="tilt-container">
      <article id="quote-card" class="quote-card" aria-live="polite" aria-atomic="true">
        <!-- Giant decorative watermark quotation mark -->
        <span class="decorative-quote-mark" aria-hidden="true">“</span>

        <!-- Category Badge with live pulsing dot -->
        <div class="category-badge-container">
          <span class="category-badge">
            <span class="pulse-dot" aria-hidden="true"></span>
            <span id="quote-category">Inspiration</span>
          </span>
        </div>

        <!-- Quote Body and Author -->
        <div class="quote-content">
          <blockquote id="quote-text" class="quote-text">
            “The only way to do great work is to love what you do.”
          </blockquote>
          <div class="quote-author-wrapper">
            <div class="quote-author-pill">
              <svg class="verified-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
              <cite id="quote-author" class="quote-author">— Steve Jobs</cite>
            </div>
          </div>
        </div>

        <div class="card-divider" role="separator"></div>

        <!-- Interactive Control Bar -->
        <div class="card-actions">
          <!-- Secondary Micro-Actions -->
          <div class="secondary-actions">
            <!-- Like / Save to Favorites -->
            <button id="like-quote-btn" class="action-btn-icon" title="Save to Favorites" aria-label="Save quote to favorites">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
              <span class="sr-only">Like quote</span>
            </button>

            <!-- Copy to Clipboard -->
            <button id="copy-quote-btn" class="action-btn-icon" title="Copy to clipboard" aria-label="Copy quote to clipboard">
              <svg id="copy-default-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <svg id="copy-check-icon" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span class="sr-only">Copy quote</span>
            </button>

            <!-- Tweet / Share on X -->
            <button id="tweet-quote-btn" class="action-btn-icon" title="Share on Twitter / X" aria-label="Share quote on X">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
              </svg>
              <span class="sr-only">Share on X</span>
            </button>

            <!-- Read Aloud Speech Synthesizer with Equalizer Animation -->
            <button id="speak-quote-btn" class="action-btn-icon" title="Listen to quote" aria-label="Read quote aloud">
              <svg class="speech-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
              <div class="equalizer" aria-hidden="true">
                <span class="equalizer-bar"></span>
                <span class="equalizer-bar"></span>
                <span class="equalizer-bar"></span>
              </div>
              <span class="sr-only">Read quote aloud</span>
            </button>
          </div>

          <!-- Primary "New Quote" Shimmer Button -->
          <button id="new-quote-btn" class="btn-primary" aria-label="Generate new random quote">
            <span>New Quote</span>
            <svg class="btn-icon-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
        </div>
      </article>
    </div>

    <!-- Desktop Keyboard Shortcut Hint -->
    <div class="keyboard-hint" aria-hidden="true">
      <span>Tip: Press</span>
      <kbd class="kbd-badge">Space</kbd>
      <span>for next quote &bull;</span>
      <kbd class="kbd-badge">C</kbd>
      <span>to copy &bull;</span>
      <kbd class="kbd-badge">L</kbd>
      <span>to like</span>
    </div>
  </main>

  <!-- Slide-out Saved Favorites Drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>
  <aside id="favorites-drawer" class="favorites-drawer" role="dialog" aria-labelledby="fav-drawer-title" aria-modal="true">
    <div class="drawer-header">
      <h2 id="fav-drawer-title" class="drawer-title">
        <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span>Favorites</span>
      </h2>
      <button id="close-drawer-btn" class="drawer-close-btn" aria-label="Close favorites drawer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="favorites-list" class="drawer-content">
      <!-- Populated dynamically via app.js -->
    </div>
  </aside>

  <!-- Toast Feedback -->
  <div id="toast" class="toast" role="status" aria-live="assertive">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toast-text">Quote copied to clipboard!</span>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <p>&copy; 2026 QuoteVerse &bull; Crafted with pure modern web technologies</p>
  </footer>

  <!-- Scripts -->
  <script src="js/quotes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
